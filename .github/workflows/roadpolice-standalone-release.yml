name: Publish RoadPolice Standalone public release

on:
  push:
    branches: [main]
    paths:
      - 'roadpolice-standalone/**'
      - '.github/workflows/roadpolice-standalone-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roadpolice-standalone-public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate signed binary and public update manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          folder = Path("roadpolice-standalone")
          candidate = folder / "candidate.json"
          data = json.loads((candidate if candidate.exists() else folder / "latest.json").read_text(encoding="utf-8"))
          version = data["versionName"]
          assert re.fullmatch(r"1\.0\.[0-9]+", version), "Invalid version name"
          assert data["versionCode"] > 0, "Invalid versionCode"
          asset = folder / ("roadpolice-standalone-" + version + ".apk")
          payload = asset.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == data["sha256"], "APK checksum mismatch"
          assert len(payload) == data["size"], "APK size mismatch"
          expected = (
              "https://github.com/edgar198282-ux/edgar198282-ux/releases/download/"
              + "roadpolice-standalone-v" + version
              + "/roadpolice-standalone-" + version + ".apk"
          )
          assert data["apkUrl"] == expected, "Unexpected updater URL"
          (folder / "SHA256SUMS.txt").write_text(
              f"{digest}  {asset.name}\n", encoding="ascii"
          )
          PY

      - name: Publish versioned release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json,pathlib; p=pathlib.Path("roadpolice-standalone/candidate.json"); print(json.loads((p if p.exists() else p.with_name("latest.json")).read_text())["versionName"])')"
          TAG="roadpolice-standalone-v$VERSION"
          APK="roadpolice-standalone/roadpolice-standalone-$VERSION.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release download "$TAG" --pattern "roadpolice-standalone-$VERSION.apk" --dir existing-release --repo "$GITHUB_REPOSITORY"
            cmp "$APK" "existing-release/roadpolice-standalone-$VERSION.apk"
          else
            gh release create "$TAG" "$APK" roadpolice-standalone/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "RoadPolice Standalone $VERSION" --notes "Автономная Android-версия RoadPolice. APK подписан тем же сертификатом. Устанавливается поверх предыдущей версии без удаления данных."
          fi

