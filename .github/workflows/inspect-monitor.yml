name: Inspect ABAJ Monitor 0.6.6
on:
  push:
    branches: [abaj-monitor-v066-hotfix]
    paths:
      - .github/workflows/inspect-monitor.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect existing APK without changing it
        shell: bash
        run: |
          set -euo pipefail
          test -s ABAJ-Monitor-One-v0.6.6.apk
          mkdir -p diagnostic-v066
          file ABAJ-Monitor-One-v0.6.6.apk > diagnostic-v066/metadata.txt
          sha256sum ABAJ-Monitor-One-v0.6.6.apk >> diagnostic-v066/metadata.txt
          keytool -printcert -jarfile ABAJ-Monitor-One-v0.6.6.apk >> diagnostic-v066/metadata.txt 2>&1 || true
          curl -fLsS --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --threads-count 2 --no-res -d /tmp/jadx-out ABAJ-Monitor-One-v0.6.6.apk
          find /tmp/jadx-out/sources -type f | sed 's@^/tmp/jadx-out/sources/@@' > diagnostic-v066/java-files.txt
          mkdir -p diagnostic-v066/sources
          while IFS= read -r f; do
            cp --parents "/tmp/jadx-out/sources/$f" diagnostic-v066/sources
          done < <(grep -Ei '(^|/)(MainActivity|MediaTestActivity|.*Theme.*|.*Camera.*|.*Setting.*|.*Navigation.*|.*Tab.*|.*Bottom.*)\.java$' diagnostic-v066/java-files.txt | head -30)
          grep -rlE 'ABAJ MONITOR|Проверить на моём телефоне|Контакты|Источник обновлений' /tmp/jadx-out/sources | head -20 | while IFS= read -r f; do cp --parents "$f" diagnostic-v066/sources; done || true
          find diagnostic-v066 -type f -printf '%p (%s bytes)\n'
      - name: Save isolated diagnostic output on hotfix branch only
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add diagnostic-v066
          if ! git diff --cached --quiet; then git commit -m 'Inspect 0.6.6 APK camera and navigation sources'; git push; fi
