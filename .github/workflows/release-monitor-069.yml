name: Publish ABAJ Monitor 0.6.9 compact settings and contact calls
on:
  push:
    branches: [abaj-monitor-v069-release-staging]
    paths: ['.github/workflows/release-monitor-069.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abaj-monitor-one-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild release APK and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/abaj-release
          test "$(find v069-transfer -maxdepth 1 -type f -name 'apk.part.*' | wc -l)" -eq 9
          cat v069-transfer/apk.part.0{00..08} | base64 -d > /tmp/abaj-release/ABAJ-Monitor-One-v0.6.9.apk
          echo "aec66148dffd3372b1b9601aa08caf3dcee4bf4658f35e97bfdbe5dc1db52be3  /tmp/abaj-release/ABAJ-Monitor-One-v0.6.9.apk" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 -o /tmp/abaj-release/ABAJ-Monitor-One-v0.6.8.apk \
            https://raw.githubusercontent.com/edgar198282-ux/edgar198282-ux/abaj-monitor-downloads/ABAJ-Monitor-One-v0.6.8.apk
          echo "0aa94aa4935f281e6ce1ea47ba8c027a23131976167880574ceec2e5d039ebf0  /tmp/abaj-release/ABAJ-Monitor-One-v0.6.8.apk" | sha256sum -c -
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" 'build-tools;35.0.0'
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$signer" verify --print-certs /tmp/abaj-release/ABAJ-Monitor-One-v0.6.8.apk > /tmp/abaj-release/old-cert.txt
          "$signer" verify --print-certs /tmp/abaj-release/ABAJ-Monitor-One-v0.6.9.apk > /tmp/abaj-release/new-cert.txt
          old="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/abaj-release/old-cert.txt | head -1)"
          new="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/abaj-release/new-cert.txt | head -1)"
          test -n "$old"
          test "$old" = "$new"
          "$aapt" dump badging /tmp/abaj-release/ABAJ-Monitor-One-v0.6.8.apk | head -1 | grep -q "name='am.abaj.monitor.client' versionCode='15'"
          "$aapt" dump badging /tmp/abaj-release/ABAJ-Monitor-One-v0.6.9.apk | head -1 | grep -q "name='am.abaj.monitor.client' versionCode='16'"
      - name: Publish binary and update manifest only when checks pass
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin abaj-monitor-downloads
          git checkout -B abaj-monitor-downloads origin/abaj-monitor-downloads
          python3 - <<'PY'
          import json
          info=json.load(open('peer-updates.json',encoding='utf8'))
          assert info['versionCode']==15
          assert info['sha256']=='0aa94aa4935f281e6ce1ea47ba8c027a23131976167880574ceec2e5d039ebf0'
          PY
          cp /tmp/abaj-release/ABAJ-Monitor-One-v0.6.9.apk ABAJ-Monitor-One-v0.6.9.apk
          cp /tmp/abaj-release/ABAJ-Monitor-One-v0.6.9.apk ABAJ-Monitor-One.apk
          python3 - <<'PY'
          import json
          version={'versionCode':16,'apkUrl':'https://raw.githubusercontent.com/edgar198282-ux/edgar198282-ux/abaj-monitor-downloads/ABAJ-Monitor-One-v0.6.9.apk','sha256':'aec66148dffd3372b1b9601aa08caf3dcee4bf4658f35e97bfdbe5dc1db52be3'}
          with open('peer-updates.json','w',encoding='utf8') as f:
              json.dump(version,f,ensure_ascii=False)
          PY
          cat > README-One.md <<'EOF'
          # ABAJ Monitor One 0.6.9

          [Скачать ABAJ Monitor One 0.6.9](./ABAJ-Monitor-One-v0.6.9.apk)

          Настройки упрощены: кнопки «Источник обновлений», «Тёмная/Светлая тема» и «Проверить на моём телефоне» скрыты с экрана, а тема переключается маленьким значком справа в шапке.

          В «Люди» под каждым сохранённым контактом видны отдельные кнопки 📞 Аудио и 📹 Видео. Интернет-звонки используют Jitsi Meet, а приглашения передаются через существующий шифрованный ntfy.sh-канал. Для входящего вызова в текущей реализации нужно открытое приложение.

          Обновление APK сохранено и подписано тем же сертификатом, что 0.6.8. Для установки поверх приложения не требуется удалять пользовательские данные.
          EOF
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add ABAJ-Monitor-One-v0.6.9.apk ABAJ-Monitor-One.apk peer-updates.json README-One.md
          git commit -m "release: ABAJ Monitor One 0.6.9 compact controls and visible contact call buttons [skip ci]"
          git push origin HEAD:abaj-monitor-downloads
