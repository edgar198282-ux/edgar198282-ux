name: Publish ABAJ Monitor 0.7.4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-monitor-074.yml']
  workflow_dispatch:
# Release verification and staged artifact publication only
permissions:
  contents: write
concurrency:
  group: abaj-monitor-one-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abaj-monitor-v071-release-staging
      - name: Verify APK integrity, signer and Android version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/abaj-release
          test "$(find v074-transfer -maxdepth 1 -type f -name 'apk.part.*' | wc -l)" -eq 9
          cat v074-transfer/apk.part.0{00..08} | base64 -d > /tmp/abaj-release/ABAJ-Monitor-One-v0.7.4.apk
          echo "555181d9a5e4be5df0f17f7f3b6f5ad85f06ea13879e93df450a0098f405dced  /tmp/abaj-release/ABAJ-Monitor-One-v0.7.4.apk" | sha256sum -c -
          curl -fL --retry 3 --connect-timeout 15 -o /tmp/abaj-release/ABAJ-Monitor-One-v0.7.2.apk \
            https://raw.githubusercontent.com/edgar198282-ux/edgar198282-ux/abaj-monitor-downloads/ABAJ-Monitor-One-v0.7.2.apk
          echo "87042d6fac9b8126c13dbf4cfb52bb3c6e20b98e5940e0099a24e02834f2f0f1  /tmp/abaj-release/ABAJ-Monitor-One-v0.7.2.apk" | sha256sum -c -
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" 'build-tools;35.0.0'
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$signer" verify --print-certs /tmp/abaj-release/ABAJ-Monitor-One-v0.7.2.apk > /tmp/abaj-release/old-cert.txt
          "$signer" verify --print-certs /tmp/abaj-release/ABAJ-Monitor-One-v0.7.4.apk > /tmp/abaj-release/new-cert.txt
          old="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/abaj-release/old-cert.txt | head -1)"
          new="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/abaj-release/new-cert.txt | head -1)"
          test -n "$old"
          test "$old" = "$new"
          test "$new" = "fb12aaa4185268d321205f19a434cb85cb98654c79e98b11a12e402a853b4663"
          "$aapt" dump badging /tmp/abaj-release/ABAJ-Monitor-One-v0.7.2.apk | head -1 | grep -q "name='am.abaj.monitor.client' versionCode='19'"
          "$aapt" dump badging /tmp/abaj-release/ABAJ-Monitor-One-v0.7.4.apk | head -1 | grep -q "name='am.abaj.monitor.client' versionCode='21'"
      - name: Publish signed version and auto-update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin abaj-monitor-downloads
          git checkout -B abaj-monitor-downloads origin/abaj-monitor-downloads
          python3 - <<'PY'
          import json
          info=json.load(open('peer-updates.json',encoding='utf8'))
          assert info['versionCode']==19, "Release channel has an unexpected version"
          assert info['sha256']=='87042d6fac9b8126c13dbf4cfb52bb3c6e20b98e5940e0099a24e02834f2f0f1'
          PY
          cp /tmp/abaj-release/ABAJ-Monitor-One-v0.7.4.apk ABAJ-Monitor-One-v0.7.4.apk
          cp /tmp/abaj-release/ABAJ-Monitor-One-v0.7.4.apk ABAJ-Monitor-One.apk
          python3 - <<'PY'
          import json
          obj={'versionCode':21,'apkUrl':'https://raw.githubusercontent.com/edgar198282-ux/edgar198282-ux/abaj-monitor-downloads/ABAJ-Monitor-One-v0.7.4.apk','sha256':'555181d9a5e4be5df0f17f7f3b6f5ad85f06ea13879e93df450a0098f405dced'}
          with open('peer-updates.json','w',encoding='utf8') as f: json.dump(obj,f,ensure_ascii=False)
          PY
          cat > README-One.md <<'EOF'
          # ABAJ Monitor One v0.7.4

          [Скачать ABAJ MONITOR 0.7.4](./ABAJ-Monitor-One-v0.7.4.apk)

          Включение и отключение GPS перенесено из раздела «Карта» в «Настройки». Экран карты поддерживает светлую и тёмную темы. Переключатели языка и темы остаются в настройках.

          Геолокация запускается вручную после разрешения Android на местоположение «Всегда», затем продолжает работать в видимой foreground-службе до ручного отключения. Согласованная передача восстанавливается после перезапуска приложения; после перезагрузки телефона — если это позволяет Android.

          📞 Аудиозвонок и 📹 видеозвонок доступны в карточке добавленных контактов, работают через внешний сервис Jitsi Meet, приглашения передаются через ntfy.sh. Для входящего звонка нужно открытое приложение или касание уведомления. Надёжная доставка звонков при закрытом приложении не гарантируется.

          Автообновление подключено. APK 0.7.4 подписан сертификатом версии 0.7.2.
          EOF
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add ABAJ-Monitor-One-v0.7.4.apk ABAJ-Monitor-One.apk peer-updates.json README-One.md
          git commit -m "release: ABAJ Monitor One v0.7.4 RU AM settings badges and persistent GPS [skip ci]"
          git push origin HEAD:abaj-monitor-downloads
# Trigger verified v0.7.4 release publication
