name: Publish ABAJ Monitor One 0.6.3
on:
  push:
    branches: [abaj-monitor-downloads]
    paths: [.github/workflows/release063.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify final APK
        shell: bash
        run: |
          cat transfer063/apk.part0{0,1,2,3,4,5,6,7} | base64 -d > ABAJ-Monitor-One-v0.6.3.apk
          echo '96d96443a995e972a0756a05ef46fb118928c7eb6b0cb2fce423b677826c044e  ABAJ-Monitor-One-v0.6.3.apk' | sha256sum -c -
          test "$(stat -c '%s' ABAJ-Monitor-One-v0.6.3.apk)" = '2373502'
          cp ABAJ-Monitor-One-v0.6.3.apk ABAJ-Monitor-One.apk
          python3 - <<'PY'
          import json
          manifest={
              'versionCode': 10,
              'apkUrl': 'https://raw.githubusercontent.com/edgar198282-ux/edgar198282-ux/abaj-monitor-downloads/ABAJ-Monitor-One-v0.6.3.apk',
              'sha256': '96d96443a995e972a0756a05ef46fb118928c7eb6b0cb2fce423b677826c044e'
          }
          for path in ('peer-updates.json', 'client-updates.json'):
              with open(path,'w') as f: json.dump(manifest, f)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ABAJ-Monitor-One.apk ABAJ-Monitor-One-v0.6.3.apk peer-updates.json client-updates.json
          git commit -m 'release: v0.6.3 fix local camera lifecycle and video return'
          git push origin HEAD:abaj-monitor-downloads
