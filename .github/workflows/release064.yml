name: Publish ABAJ Monitor One 0.6.4
on:
  push:
    branches: [abaj-monitor-downloads]
    paths: [.github/workflows/release064.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish APK signed by persistent key
        shell: bash
        run: |
          set -euo pipefail
          cat transfer064/apk.part0{0,1,2,3,4,5,6,7} | base64 -d > ABAJ-Monitor-One-v0.6.4.apk
          echo '5097db1fc07d14561fd43920ac57ec4742548bc19717737db98d330d19d0a069  ABAJ-Monitor-One-v0.6.4.apk' | sha256sum -c -
          test "$(stat -c '%s' ABAJ-Monitor-One-v0.6.4.apk)" = '2373502'
          cp ABAJ-Monitor-One-v0.6.4.apk ABAJ-Monitor-One.apk
          python3 - <<'PY'
          import json
          manifest={
              'versionCode': 11,
              'apkUrl': 'https://raw.githubusercontent.com/edgar198282-ux/edgar198282-ux/abaj-monitor-downloads/ABAJ-Monitor-One-v0.6.4.apk',
              'sha256': '5097db1fc07d14561fd43920ac57ec4742548bc19717737db98d330d19d0a069'
          }
          for name in ('peer-updates.json','client-updates.json'):
              with open(name,'w') as f: json.dump(manifest,f)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ABAJ-Monitor-One.apk ABAJ-Monitor-One-v0.6.4.apk peer-updates.json client-updates.json
          git commit -m 'release: ABAJ Monitor One 0.6.4 with pinned signing certificate'
          git push origin HEAD:abaj-monitor-downloads
